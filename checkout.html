<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Churned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo"><span class="dot"></span>Churned</a>
    <div class="nav-links">
      <a href="index.html#buy">← Continue squishing</a>
    </div>
    <div class="nav-right">
      <button class="cart-btn" id="cartBtn" aria-label="Basket" onclick="window.location.href='index.html#buy'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2.4 12.4a2 2 0 002 1.6h8.2a2 2 0 002-1.6L21 8H6" stroke="#1C1A14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.5" fill="#1C1A14"/><circle cx="17" cy="20" r="1.5" fill="#1C1A14"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </nav>
</header>

<section class="checkout-head wrap">
  <h1>Checkout</h1>
  <div class="steps">
    <span class="step active"><span class="dot2"></span>Basket</span>
    <span class="sep">—</span>
    <span class="step active" id="stepShip"><span class="dot2"></span>Details</span>
    <span class="sep">—</span>
    <span class="step" id="stepConfirm"><span class="dot2"></span>Confirm</span>
  </div>
</section>

<section class="checkout-wrap wrap">
  <div id="checkoutContent"></div>
</section>

<div class="toast" id="toast"></div>

<script src="cart.js"></script>
<script>
const contentBox = document.getElementById('checkoutContent');

function swatchClass(variant){ return 'sw cart-item-swatch ' + variant; }

function summaryHTML(){
  const cart = getCart();
  const itemsHTML = cart.map(item => `
    <div class="summary-item">
      <div class="${swatchClass(item.variant)}"></div>
      <div class="info">
        <strong>${item.name} × ${item.qty}</strong>
        <span>${variantLabel(item.variant)}</span>
      </div>
      <div class="amt">$${item.qty * item.price}</div>
    </div>
  `).join('');

  const subtotal = cartTotal();

  return `
    <div class="summary-card">
      <h2>Order summary</h2>
      <div class="summary-items">${itemsHTML}</div>
      <div class="summary-row"><span>Subtotal</span><span>$${subtotal}</span></div>
      <div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
      <div class="summary-row total"><span>Total</span><span>$${subtotal}</span></div>
    </div>
  `;
}

function fieldHTML(id, label, type){
  return `
    <div class="field" id="field-${id}">
      <label for="${id}">${label}</label>
      <input type="${type}" id="${id}" name="${id}" autocomplete="${type === 'email' ? 'email' : 'on'}">
      <span class="field-error">This field looks off — double check it.</span>
    </div>
  `;
}

function formHTML(){
  return `
    <div>
      <div class="panel">
        <h2>Your details</h2>
        <form id="shipForm" novalidate>
          <div class="field-row">
            ${fieldHTML('firstName', 'First name', 'text')}
            ${fieldHTML('lastName', 'Last name', 'text')}
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email">
            <span class="field-error">Enter a valid email address.</span>
          </div>
        </form>
        <p class="demo-note">Your shipping address and payment details are entered securely on Stripe's payment page next. We never see or store your card details.</p>
      </div>

      <button type="button" class="btn-primary" id="placeOrderBtn" style="width:100%; text-align:center; margin-top:6px;">Continue to payment — $${cartTotal()}</button>
    </div>
  `;
}

function markInvalid(id, invalid){
  const field = document.getElementById('field-' + id);
  if(field) field.classList.toggle('invalid', invalid);
}

function validateForm(){
  let ok = true;
  const required = ['firstName','lastName','email'];
  required.forEach(id => {
    const el = document.getElementById(id);
    const invalid = !el || el.value.trim() === '';
    markInvalid(id, invalid);
    if(invalid) ok = false;
  });

  const email = document.getElementById('email');
  const emailOk = email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  markInvalid('email', !emailOk);
  if(!emailOk) ok = false;

  return ok;
}

function confirmHTML(){
  return `
    <div class="confirm-panel">
      <div class="confirm-check">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#28439E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Order placed!</h2>
      <p>Your basket is on its way to the squish-packing station.</p>
      <p style="margin-bottom:24px;">A confirmation email is on its way from Stripe.</p>
      <a href="index.html" class="btn-primary">Back to shop</a>
    </div>
  `;
}

function cancelHTML(){
  return `
    <div class="checkout-grid">${formHTML()}${summaryHTML()}</div>
  `;
}

function renderCheckout(){
  const params = new URLSearchParams(window.location.search);

  // Coming back from a successful Stripe payment
  if(params.get('success') === '1'){
    clearCart();
    document.getElementById('stepConfirm').classList.add('active');
    contentBox.innerHTML = confirmHTML();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const cart = getCart();
  if(cart.length === 0){
    contentBox.innerHTML = `
      <div class="empty-cart-panel">
        <h2>Your basket is empty</h2>
        <p>Grab a Butter Squish before you check out.</p>
        <a href="index.html#buy" class="btn-primary">Shop the squish</a>
      </div>
    `;
    return;
  }

  if(params.get('canceled') === '1'){
    showToast('Payment canceled — your basket is still here');
  }

  contentBox.innerHTML = `<div class="checkout-grid">${formHTML()}${summaryHTML()}</div>`;

  document.getElementById('placeOrderBtn').addEventListener('click', async () => {
    if(!validateForm()){
      showToast('Check the highlighted fields');
      return;
    }

    const btn = document.getElementById('placeOrderBtn');
    btn.disabled = true;
    btn.textContent = 'Redirecting to payment…';

    try {
      const res = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cart: getCart(),
          email: document.getElementById('email').value.trim(),
        }),
      });

      const data = await res.json();

      if(!res.ok || !data.url){
        throw new Error(data.error || 'Could not start checkout.');
      }

      window.location.href = data.url;

    } catch(err) {
      console.error(err);
      showToast('Something went wrong — please try again');
      btn.disabled = false;
      btn.textContent = `Continue to payment — $${cartTotal()}`;
    }
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('DOMContentLoaded', renderCheckout);
</script>
</body>
</html>
