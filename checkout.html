<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Churned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="logo"><span class="dot"></span>Churned</a>
    <div class="nav-links">
      <a href="index.html#buy">← Continue squishing</a>
    </div>
    <div class="nav-right">
      <button class="cart-btn" id="cartBtn" aria-label="Basket" onclick="window.location.href='index.html#buy'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2.4 12.4a2 2 0 002 1.6h8.2a2 2 0 002-1.6L21 8H6" stroke="#1C1A14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.5" fill="#1C1A14"/><circle cx="17" cy="20" r="1.5" fill="#1C1A14"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </nav>
</header>

<section class="checkout-head wrap">
  <h1>Checkout</h1>
  <div class="steps">
    <span class="step active"><span class="dot2"></span>Basket</span>
    <span class="sep">—</span>
    <span class="step active" id="stepShip"><span class="dot2"></span>Shipping</span>
    <span class="sep">—</span>
    <span class="step" id="stepConfirm"><span class="dot2"></span>Confirm</span>
  </div>
</section>

<section class="checkout-wrap wrap">
  <div id="checkoutContent"></div>
</section>

<div class="toast" id="toast"></div>

<script src="cart.js"></script>
<script>
const contentBox = document.getElementById('checkoutContent');

function swatchClass(variant){ return 'sw cart-item-swatch ' + variant; }

function summaryHTML(){
  const cart = getCart();
  const itemsHTML = cart.map(item => `
    <div class="summary-item">
      <div class="${swatchClass(item.variant)}"></div>
      <div class="info">
        <strong>${item.name} × ${item.qty}</strong>
        <span>${variantLabel(item.variant)}</span>
      </div>
      <div class="amt">$${item.qty * item.price}</div>
    </div>
  `).join('');

  const subtotal = cartTotal();

  return `
    <div class="summary-card">
      <h2>Order summary</h2>
      <div class="summary-items">${itemsHTML}</div>
      <div class="summary-row"><span>Subtotal</span><span>$${subtotal}</span></div>
      <div class="summary-row"><span>Shipping</span><span>Free</span></div>
      <div class="summary-row total"><span>Total</span><span>$${subtotal}</span></div>
    </div>
  `;
}

function fieldHTML(id, label, type, span2){
  return `
    <div class="field" id="field-${id}" ${span2 ? 'style="grid-column: span 2;"' : ''}>
      <label for="${id}">${label}</label>
      <input type="${type}" id="${id}" name="${id}" autocomplete="${type === 'email' ? 'email' : 'on'}">
      <span class="field-error">This field looks off — double check it.</span>
    </div>
  `;
}

function formHTML(){
  return `
    <div>
      <div class="panel">
        <h2>Shipping details</h2>
        <form id="shipForm" novalidate>
          <div class="field-row">
            ${fieldHTML('firstName', 'First name', 'text')}
            ${fieldHTML('lastName', 'Last name', 'text')}
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email">
            <span class="field-error">Enter a valid email address.</span>
          </div>
          <div class="field">
            <label for="address">Street address</label>
            <input type="text" id="address" name="address" autocomplete="street-address">
            <span class="field-error">This field looks off — double check it.</span>
          </div>
          <div class="field-row">
            ${fieldHTML('city', 'City', 'text')}
            ${fieldHTML('postal', 'Postal code', 'text')}
          </div>
          <div class="field">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="">Select a country</option>
              <option>Ireland</option>
              <option>United Kingdom</option>
              <option>United States</option>
              <option>Canada</option>
              <option>Australia</option>
              <option>Germany</option>
              <option>France</option>
              <option>Other</option>
            </select>
            <span class="field-error">Pick a country.</span>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>Payment</h2>
        <div class="field">
          <label for="cardName">Name on card</label>
          <input type="text" id="cardName" name="cardName" form="shipForm">
          <span class="field-error">This field looks off — double check it.</span>
        </div>
        <div class="field">
          <label for="cardNumber">Card number</label>
          <input type="text" id="cardNumber" name="cardNumber" form="shipForm" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19">
          <span class="field-error">Card number should be 16 digits.</span>
        </div>
        <div class="field-row">
          <div class="field" id="field-expiry">
            <label for="expiry">Expiry</label>
            <input type="text" id="expiry" name="expiry" form="shipForm" placeholder="MM/YY" maxlength="5">
            <span class="field-error">Use MM/YY format.</span>
          </div>
          <div class="field" id="field-cvc">
            <label for="cvc">CVC</label>
            <input type="text" id="cvc" name="cvc" form="shipForm" inputmode="numeric" placeholder="123" maxlength="4">
            <span class="field-error">3–4 digits.</span>
          </div>
        </div>
        <p class="demo-note">This is a demo checkout — no real payment is processed and no card details are stored or transmitted anywhere.</p>
      </div>

      <button type="button" class="btn-primary" id="placeOrderBtn" style="width:100%; text-align:center; margin-top:6px;">Place order — $${cartTotal()}</button>
    </div>
  `;
}

function attachCardFormatting(){
  const cardNumber = document.getElementById('cardNumber');
  if(cardNumber){
    cardNumber.addEventListener('input', () => {
      let v = cardNumber.value.replace(/\D/g, '').slice(0, 16);
      cardNumber.value = v.replace(/(.{4})/g, '$1 ').trim();
    });
  }
  const expiry = document.getElementById('expiry');
  if(expiry){
    expiry.addEventListener('input', () => {
      let v = expiry.value.replace(/\D/g, '').slice(0, 4);
      if(v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
      expiry.value = v;
    });
  }
}

function markInvalid(id, invalid){
  const field = document.getElementById('field-' + id);
  if(field) field.classList.toggle('invalid', invalid);
}

function validateForm(){
  let ok = true;
  const required = ['firstName','lastName','email','address','city','postal','country','cardName'];
  required.forEach(id => {
    const el = document.getElementById(id);
    const invalid = !el || el.value.trim() === '';
    markInvalid(id, invalid);
    if(invalid) ok = false;
  });

  const email = document.getElementById('email');
  const emailOk = email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  markInvalid('email', !emailOk);
  if(!emailOk) ok = false;

  const cardNumber = document.getElementById('cardNumber');
  const cardOk = cardNumber && cardNumber.value.replace(/\D/g,'').length === 16;
  markInvalid('cardNumber', !cardOk);
  if(!cardOk) ok = false;

  const expiry = document.getElementById('expiry');
  const expiryOk = expiry && /^\d{2}\/\d{2}$/.test(expiry.value.trim());
  markInvalid('expiry', !expiryOk);
  if(!expiryOk) ok = false;

  const cvc = document.getElementById('cvc');
  const cvcOk = cvc && /^\d{3,4}$/.test(cvc.value.trim());
  markInvalid('cvc', !cvcOk);
  if(!cvcOk) ok = false;

  return ok;
}

function generateOrderId(){
  return 'CH-' + Math.random().toString(36).slice(2, 8).toUpperCase();
}

function confirmHTML(orderId, name){
  return `
    <div class="confirm-panel">
      <div class="confirm-check">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#28439E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Order placed, ${name}!</h2>
      <p>Your basket is on its way to the squish-packing station.</p>
      <div class="confirm-order-id">Order ${orderId}</div>
      <p style="margin-bottom:24px;">A confirmation would normally land in your inbox here.</p>
      <a href="index.html" class="btn-primary">Back to shop</a>
    </div>
  `;
}

function renderCheckout(){
  const cart = getCart();
  if(cart.length === 0){
    contentBox.innerHTML = `
      <div class="empty-cart-panel">
        <h2>Your basket is empty</h2>
        <p>Grab a Butter Squish before you check out.</p>
        <a href="index.html#buy" class="btn-primary">Shop the squish</a>
      </div>
    `;
    return;
  }

  contentBox.innerHTML = `<div class="checkout-grid">${formHTML()}${summaryHTML()}</div>`;
  attachCardFormatting();

  document.getElementById('placeOrderBtn').addEventListener('click', () => {
    if(!validateForm()){
      showToast('Check the highlighted fields');
      return;
    }
    const name = document.getElementById('firstName').value.trim();
    const orderId = generateOrderId();
    clearCart();
    document.getElementById('stepConfirm').classList.add('active');
    contentBox.innerHTML = confirmHTML(orderId, name);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('DOMContentLoaded', renderCheckout);
</script>
</body>
</html>
